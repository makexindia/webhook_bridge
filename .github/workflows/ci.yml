name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    name: Lint, Typecheck & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    env:
      AUTH_TOKEN: test-ci-secret-token-32-chars-long
      WEBHOOK_HMAC_SECRET: test-ci-hmac-secret-key-for-verification
      ALLOWED_WEBHOOK_DOMAINS: "example.com,makex.in"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run TypeScript type-check
        run: npm run type-check

      - name: Run Vitest test suite
        run: npm run test
